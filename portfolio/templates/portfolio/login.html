{% extends "portfolio/index.html" %}
{% load crispy_forms_tags %}
{% block start %}

 <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Log in</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">
            Log in
        </button>
    </form>

    <p class="text-center mt-4 text-gray-600">
        Don't have an account? 
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Sign up</a>
    </p>
</div>
{% endblock start %}
